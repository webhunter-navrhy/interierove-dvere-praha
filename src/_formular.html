{# Kontaktní formulář. Endpoint a demo režim z _data/site.json (formular.endpoint, formular.demo). #}
<form class="formular" method="post" {% if site.formular.endpoint and not site.formular.demo %}action="{{ site.formular.endpoint }}"{% endif %} data-endpoint="{{ site.formular.endpoint }}" data-demo="{{ 1 if site.formular.demo or not site.formular.endpoint else 0 }}">
  <label>Jméno a příjmení <input name="jmeno" autocomplete="name" required></label>
  <div class="formular__dva">
    <label>E-mail <input name="email" type="email" autocomplete="email"></label>
    <label>Telefon <input name="telefon" type="tel" autocomplete="tel"></label>
  </div>
  <label>Zpráva <textarea name="zprava" rows="5" required></textarea></label>
  <label class="souhlas"><input type="checkbox" name="souhlas" required><span>Souhlasím se zpracováním osobních údajů za účelem vyřízení dotazu (<a href="{{ url('ochrana-osobnich-udaju') }}">podrobnosti</a>).</span></label>
  <div class="past" aria-hidden="true"><label>Nevyplňovat <input name="_gotcha" tabindex="-1" autocomplete="off"></label></div>
  <input type="hidden" name="_subject" value="{{ site.formular.predmet }}">
  <button type="submit" class="tlacitko">Odeslat zprávu</button>
  <p class="formular-stav" role="status" aria-live="polite"></p>
</form>
